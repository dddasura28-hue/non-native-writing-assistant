[package]
name = "non-native-writing-tsf-service"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "non_native_writing_tsf_service"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tsf-dev-register"
path = "src/bin/tsf-dev-register.rs"

[dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
] }
windows-core = "=0.61.2"

[profile.release]
lto = "thin"
